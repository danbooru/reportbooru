# Run the tests, then build and push the image to ghcr.io/<owner>/reportbooru on pushes to master.
#
# The image is tagged with the full commit hash and `latest`.
#
# https://docs.github.com/en/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions

name: Image

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5

      # https://github.com/ruby/setup-ruby
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bundle exec rake test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/reportbooru
    steps:
      - uses: actions/checkout@v5

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # https://github.com/docker/metadata-action
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # https://github.com/docker/build-push-action
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
